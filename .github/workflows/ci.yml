name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm test
      - run: npm run build
      - name: Smoke-test proposal CLI
        run: |
          node cli/proposal.mjs examples/proposta-exemplo.json > "$RUNNER_TEMP/proposal.md"
          grep -q "Proposta de Serviços" "$RUNNER_TEMP/proposal.md"
          node cli/proposal.mjs examples/proposta-exemplo.json "$RUNNER_TEMP/output.md"
          test -s "$RUNNER_TEMP/output.md"
          if node cli/proposal.mjs examples/proposta-exemplo.json "$RUNNER_TEMP/output.md"; then
            echo "CLI should not overwrite an existing file"
            exit 1
          fi
