name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      # Este repositório ainda não versiona package-lock.json; não usar npm ci
      # nem cache npm até existir um lockfile revisado.
      - run: npm install
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - name: Smoke-test proposal CLI
        run: |
          node cli/proposal.mjs examples/proposta-exemplo.json > "$RUNNER_TEMP/proposal.md"
          grep -q "Proposta de Serviços" "$RUNNER_TEMP/proposal.md"
          node cli/proposal.mjs examples/proposta-exemplo.json "$RUNNER_TEMP/output.md"
          test -s "$RUNNER_TEMP/output.md"
          if node cli/proposal.mjs examples/proposta-exemplo.json "$RUNNER_TEMP/output.md"; then
            echo "CLI should not overwrite an existing file"
            exit 1
          fi
